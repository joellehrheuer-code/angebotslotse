name: V13 Design Validation
on:
  push:
    branches:
      - feature/v13-brand-commerce
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          SITE_URL: https://joellehrheuer-code.github.io/angebotslotse
          CONTACT_EMAIL: joellehrheuer@gmail.com
          LEGAL_NAME: Joel Leroy Lehrheuer
          LEGAL_ADDRESS: Rathausstraße 4, 52072 Aachen, Deutschland
      - run: npm run check
      - run: npm run build && npm run validate && npm run seo && npm run security
        env:
          SITE_URL: https://joellehrheuer-code.github.io/angebotslotse
          CONTACT_EMAIL: joellehrheuer@gmail.com
          LEGAL_NAME: Joel Leroy Lehrheuer
          LEGAL_ADDRESS: Rathausstraße 4, 52072 Aachen, Deutschland
