name: Täglicher Integritätscheck
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: angebotslotse-integrity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Quellenstatus ohne Zugangsdaten
        run: node scripts/source-health-summary.mjs
      - name: Verified offer catalogue required
        run: npm run catalog:health
      - run: npm test
      - run: npm run check
      - run: npm run build && npm run validate && npm run seo && npm run security
        env:
          SITE_URL: https://joellehrheuer-code.github.io/angebotslotse
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - run: npm run report
        env:
          AWIN_PUBLISHER_ID: ${{ vars.AWIN_PUBLISHER_ID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}

      - name: Preserve status diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integrity-diagnostics-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: data/status.json
