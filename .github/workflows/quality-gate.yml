name: Angebotslotse Quality Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: angebot-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://joellehrheuer-code.github.io/angebotslotse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Unit and regression tests
        run: npm test
      - name: Build without production secrets
        run: npm run build
      - name: Validate generated website
        run: npm run validate
      - name: Security scan for exposed secrets
        run: npm run security
      - name: SEO validation
        run: npm run seo
