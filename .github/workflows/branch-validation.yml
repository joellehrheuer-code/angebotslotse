name: V9 Branch Validation

on:
  push:
    branches:
      - "work/**"
      - "feature/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: branch-validation-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Build + quality gates
        run: npm run check && npm run build && npm run validate && npm run seo && npm run security
        env:
          SITE_URL: https://joellehrheuer-code.github.io/angebotslotse
          CONTACT_EMAIL: joellehrheuer@gmail.com
          LEGAL_NAME: Joel Leroy Lehrheuer
          LEGAL_ADDRESS: Rathausstraße 4, 52072 Aachen, Deutschland
