name: Angebote aktualisieren
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/offers.json"
      - "data/status.json"
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: angebotslotse-update-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run update
        env:
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID || vars.AWIN_PUBLISHER_ID }}
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_DATAFEED_API_KEY: ${{ secrets.AWIN_DATAFEED_API_KEY }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID || vars.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          IMPACT_SYNC_EVERY_HOURS: 12
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          DAISYCON_PUBLISHER_ID: ${{ secrets.DAISYCON_PUBLISHER_ID || vars.DAISYCON_PUBLISHER_ID }}
          DAISYCON_ACCESS_TOKEN: ${{ secrets.DAISYCON_ACCESS_TOKEN }}
          TRADEDOUBLER_PRODUCTS_TOKEN: ${{ secrets.TRADEDOUBLER_PRODUCTS_TOKEN }}
          TRADEDOUBLER_VOUCHERS_TOKEN: ${{ secrets.TRADEDOUBLER_VOUCHERS_TOKEN }}
          TRADEDOUBLER_FEED_URLS: ${{ secrets.TRADEDOUBLER_FEED_URLS }}
          WEBGAINS_PUBLISHER_ID: ${{ secrets.WEBGAINS_PUBLISHER_ID || vars.WEBGAINS_PUBLISHER_ID }}
          WEBGAINS_ACCESS_TOKEN: ${{ secrets.WEBGAINS_ACCESS_TOKEN }}
          WEBGAINS_FEED_URLS: ${{ secrets.WEBGAINS_FEED_URLS }}
          CREATOR_SOCIAL_FEED_URL: ${{ vars.CREATOR_SOCIAL_FEED_URL }}
          CREATOR_VIDEO_FEED_URL: ${{ vars.CREATOR_VIDEO_FEED_URL }}
      - run: npm run check && npm run build && npm run validate && npm run seo && npm run security
        env:
          SITE_URL: https://joellehrheuer-code.github.io/angebotslotse
          CONTACT_EMAIL: joellehrheuer@gmail.com
          LEGAL_NAME: Joel Leroy Lehrheuer
          LEGAL_ADDRESS: Rathausstraße 4, 52072 Aachen, Deutschland
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): Angebote automatisch aktualisieren"
          file_pattern: "data/offers.json data/offer-archive.json data/status.json data/price-history.json data/coupons.json data/affiliate-growth.json data/program-opportunities.json data/impact-opportunities.json data/affiliate-opportunities.json data/creator-feed.json data/creator-videos.json report/program-inventory.json report/manual-actions.json report/update-report.json report/seo-report.json"
  deploy:
    needs: update
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
